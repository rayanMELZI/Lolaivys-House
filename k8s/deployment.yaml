apiVersion: apps/v1
kind: Deployment
metadata:
  name: lolaivys-house
  namespace: lolaivys-house
  labels:
    app: lolaivys-house
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lolaivys-house
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lolaivys-house
    spec:
      # Needed only while the GHCR package is private. Create it with:
      #   kubectl create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=<gh-user> \
      #     --docker-password=<gh-pat-read:packages> -n lolaivys-house
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/rayanmelzi/lolaivys-house:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
